<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Музыкальная викторина</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h1 class="mb-4 text-center">🎵 Музыкальная викторина</h1>
        <p class="text-center text-muted">Загрузите аудиофайл — система определит исполнителя и трек</p>
        <form action="/recognize" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Выберите аудиофайл (MP3, WAV)</label>
                <input type="file" name="file" class="form-control" accept="audio/*" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Распознать</button>
        </form>
        <div class="text-center mt-3">
            <a href="/history">История запросов</a>
        </div>
    </div>
</div>
</body>
</html>
