<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результат</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h1 class="mb-4 text-center">🎵 Результат распознавания</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${result}">
            <table class="table table-bordered">
                <tr>
                    <th>Файл</th>
                    <td th:text="${result.fileName}"></td>
                </tr>
                <tr>
                    <th>Исполнитель</th>
                    <td th:text="${result.artist}"></td>
                </tr>
                <tr>
                    <th>Трек</th>
                    <td th:text="${result.title}"></td>
                </tr>
                <tr>
                    <th>Жанр</th>
                    <td th:text="${result.genre}"></td>
                </tr>
            </table>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-primary">Распознать ещё</a>
            <a href="/history" class="btn btn-secondary ms-2">История</a>
        </div>
    </div>
</div>
</body>
</html>
