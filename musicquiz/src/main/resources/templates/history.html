<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>История</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h1 class="mb-4 text-center">📋 История запросов</h1>

        <div th:if="${#lists.isEmpty(history)}" class="text-center text-muted">
            История пуста
        </div>

        <table th:if="${!#lists.isEmpty(history)}" class="table table-striped">
            <thead>
            <tr>
                <th>Файл</th>
                <th>Исполнитель</th>
                <th>Трек</th>
                <th>Жанр</th>
                <th>Дата</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="record : ${history}">
                <td th:text="${record.fileName}"></td>
                <td th:text="${record.artist}"></td>
                <td th:text="${record.title}"></td>
                <td th:text="${record.genre}"></td>
                <td th:text="${record.createdAt}"></td>
            </tr>
            </tbody>
        </table>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-primary">На главную</a>
        </div>
    </div>
</div>
</body>
</html>
